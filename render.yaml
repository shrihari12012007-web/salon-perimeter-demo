# ==============================================================================
# SRINIDHI EYE CARE HOSPITAL — RENDER BLUEPRINT (render.yaml)
# Super Speciality Eye Hospital & Micro-Surgery Laser Center • Gangavathi, Karnataka
# Deploys the Node.js/Express Backend Web Service and Managed PostgreSQL Database
# ==============================================================================

services:
  - type: web
    name: salon-perimeter-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://shrihari12012007-web.github.io,https://salon-perimeter-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: salon-perimeter-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: srinidhi_admin
      - key: ADMIN_PASSWORD
        value: SrinidhiEye#2026
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"

databases:
  - name: salon-perimeter-db
    databaseName: salon_perimeter
    user: salon_owner
    plan: free
